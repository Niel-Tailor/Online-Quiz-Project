<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Knowledge Quiz</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>🧠 General Knowledge Quiz</h1>
        <nav>
            <a href="index.html" class="active">Quiz</a>
            <a href="how-to.html">How To</a>
        </nav>
    </header>

    <main>
        <section id="start-screen" class="screen active">
            <h2>Welcome to the Quiz!</h2>
            <p>Test your general knowledge across 5 randomly selected questions.</p>
            <button id="start-btn" class="btn-primary">Start Quiz</button>
        </section>

        <section id="question-screen" class="screen">
            <div class="progress-bar">
                <span id="question-count"></span>
            </div>
            <h2 id="question-text"></h2>
            <div id="options-container" class="options"></div>
            <div class="btn-group">
                <button id="next-btn" class="btn-primary" disabled>Next</button>
                <button id="submit-btn" class="btn-secondary" style="display:none;">Submit Quiz</button>
            </div>
        </section>

        <section id="results-screen" class="screen">
            <h2>🎉 Quiz Complete!</h2>
            <p id="score-text"></p>
            <h3>Review:</h3>
            <div id="review-container"></div>
            <button id="restart-btn" class="btn-primary">Take Quiz Again</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 General Knowledge Quiz — Built for Learning People - Project 1</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
